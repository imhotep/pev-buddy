[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pev-buddy"
version = "0.1.0"
description = "Find EV charging stations and get turn-by-turn e-bike/e-scooter routing in San Francisco, built entirely on Overture Maps data."
requires-python = ">=3.10"
dependencies = [
    "overturemaps>=1.0",
    "pyarrow>=15",
    "shapely>=2",
    "numpy>=1.26",
    "orjson>=3",
    "click>=8",
    "tqdm>=4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
pev-buddy = "pev_buddy.sync:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
