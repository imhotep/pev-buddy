# Render deployment for PEV Buddy.
# Free-tier web service: installs deps + the package, extracts the SF Overture
# slice at build time (data/ is gitignored), then serves the API + web app.
services:
  - type: web
    name: pev-buddy
    runtime: python
    plan: free
    region: oregon
    # Extract the SF Overture slice so the app ships with static data.
    buildCommand: "pip install -r requirements.txt && pip install --no-deps . && python -m pev_buddy.sync"
    startCommand: "uvicorn pev_buddy.api:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
